name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the file type / a sample file if renderer-related.
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Prism version/commit"
