[package]
name = "prism"
version = "0.0.0"
description = "Prism desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "prism"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
mime_guess = "2"
notify = "8"
notify-debouncer-full = "0.6"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"
